name: LIREP WordPress Plugin Release

on:
  push:
    branches:
      - main
    tags:
      - 'lirep-wp-v*'
    paths:
      - 'wordpress/lirep/**'
      - 'wordpress/tests/**'
      - '.github/workflows/release-wordpress.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Test and package WordPress plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: Static and functional checks
        shell: bash
        run: |
          set -euo pipefail
          php -l wordpress/lirep/lirep.php
          php wordpress/tests/qa-plugin.php
          node --check wordpress/lirep/assets/js/lirep-embed.js
          node wordpress/tests/qa-embed.mjs
          npm run verify
      - name: Ensure release tag points to reviewed main history
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Release tag must point to main history"; exit 1; }
      - name: Validate tag matches plugin header
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#lirep-wp-v}"
          HEADER="$(sed -n 's/^ \* Version: //p' wordpress/lirep/lirep.php | head -1)"
          test "$TAG" = "$HEADER" || { echo "Version mismatch tag=$TAG header=$HEADER"; exit 1; }
      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress
          zip -X -r ../dist/lirep.zip lirep -x '*.DS_Store' '*/__MACOSX/*'
          cd ..
          unzip -t dist/lirep.zip
          unzip -Z1 dist/lirep.zip | grep -Fx 'lirep/lirep.php'
          sha256sum dist/lirep.zip | tee dist/lirep.zip.sha256
          test "$(stat -c%s dist/lirep.zip)" -lt 2097152
      - uses: actions/upload-artifact@v4
        with:
          name: lirep-wordpress-plugin
          path: dist/*
          retention-days: 30
      - name: Create immutable version tag from main, when absent
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: //p' wordpress/lirep/lirep.php | head -1)"
          TAG="lirep-wp-v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Existing tag: $TAG"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi
      - name: Publish official release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: //p' wordpress/lirep/lirep.php | head -1)"
          TAG="lirep-wp-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already published: $TAG"
            exit 0
          fi
          gh release create "$TAG" dist/lirep.zip dist/lirep.zip.sha256 \
            --title "LIREP WordPress $VERSION" \
            --notes "Versión oficial de LIREP WordPress $VERSION. Compatible con Elementor Free y Gutenberg. Requiere tenant habilitado en LIREP. Registro autónomo permanece deshabilitado hasta activar backend seguro. Integridad del ZIP mediante digest SHA-256 del asset de GitHub." \
            --verify-tag
