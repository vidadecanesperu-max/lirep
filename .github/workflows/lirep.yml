name: LIREP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lirep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Validate LIREP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo " LIREP - CI BASELINE"
          echo "======================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit:     $GITHUB_SHA"
          echo "Branch:     $GITHUB_REF_NAME"
          echo

          test -f README.md || {
            echo "ERROR: README.md not found"
            exit 1
          }

          npm run verify\n\n          echo "PASS - Repository initialized"
          echo "PASS - main branch available"
          echo "PASS - GitHub Actions operational"
          echo
          echo "LIREP CI baseline: OK"


  production-smoke:
    name: Verify deployed Worker
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deployment
        shell: bash
        run: sleep 45

      - name: Verify production health and QA tenant routing
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lirep-public-api.vidadecanes-peru.workers.dev"

          HEALTH="$(curl --fail --silent --show-error --retry 4 --retry-delay 10 "$BASE/health")"
          echo "$HEALTH"
          echo "$HEALTH" | grep -Fq '"ok":true'
          echo "$HEALTH" | grep -Fq '"version":"1.11.8"'

          CONFIG="$(curl --fail --silent --show-error --retry 4 --retry-delay 10 "$BASE/api/v1/form-config?public_prefix=LIREPQA1")"
          echo "$CONFIG"
          echo "$CONFIG" | grep -Fq '"ok":true'
          echo "$CONFIG" | grep -Fq 'LIREPQA1'
          echo "$CONFIG" | grep -Fq 'QA-001'
          echo "$CONFIG" | grep -Fq 'QA001'

          FORM="$(curl --fail --silent --show-error --retry 4 --retry-delay 10 "$BASE/libro-de-reclamaciones?public_prefix=LIREPQA1")"
          echo "$FORM" | grep -Fq 'PUBLIC_PREFIX_REQUIRED'
          echo "$FORM" | grep -Fq 'new URLSearchParams(location.search)'
          if echo "$FORM" | grep -Fq 'const PREFIX="VIDACANE"'; then
            echo "FAIL - deployed form still contains production fallback"
            exit 1
          fi

          echo "PASS - Worker 1.11.8 deployed"
          echo "PASS - QA tenant config resolved"
          echo "PASS - No production fallback in deployed form"
