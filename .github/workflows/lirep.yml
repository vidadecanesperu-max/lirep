name: LIREP CI and Staging Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_staging:
        description: "Deploy QA-229 only to lirep-qa-staging"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: lirep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Validate LIREP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run verify

  staging-deploy:
    name: Deploy QA-229 to isolated staging
    needs: baseline
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_staging == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: lirep-qa-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert staging-only configuration and QA-229 source
        shell: bash
        run: |
          set -euo pipefail
          test -f worker/wrangler.staging.jsonc
          test -f worker/src/index.js
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("worker/wrangler.staging.jsonc","utf8").replace(/^\uFEFF/,""));if(c.name!=="lirep-qa-staging"||c.vars?.SUPABASE_URL!=="https://jitcayjaztceglqlmwvl.supabase.co"||!Array.isArray(c.triggers?.crons)||c.triggers.crons.length)process.exit(1)'
          grep -Fq 'LIREP_QA229_RESEND_OUTCOME_UNKNOWN' worker/src/index.js
          grep -Fq 'LIREP_QA229_ACCEPTED_COMPLETION_FAILED' worker/src/index.js
          node --check worker/src/index.js
          test -f worker/qa229-test.cjs
          node --test worker/qa229-test.cjs
      - name: Require configured Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy staging only
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --config wrangler.staging.jsonc
      - name: Verify staging health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 https://lirep-qa-staging.vidadecanes-peru.workers.dev/health/backend | grep -Fq '"connected":true'
