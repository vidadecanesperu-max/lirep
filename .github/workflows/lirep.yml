name: LIREP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lirep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Validate LIREP and WordPress plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: Verify repository and plugin
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          php -l wordpress/lirep/lirep.php
          php -l wordpress/lirep/includes/onboarding.php
          node --check worker/src/index.js
          node --check wordpress/lirep/assets/js/lirep-onboarding.js
          php wordpress/tests/qa-plugin.php
          node --check wordpress/lirep/assets/js/lirep-embed.js
          node wordpress/tests/qa-embed.mjs

  live-observation:
    name: Observe active Cloudflare Worker (read only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Read live health without changing production
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lirep-public-api.vidadecanes-peru.workers.dev"
          for PATH_SUFFIX in /health /health/backend; do
            CODE="$(curl --max-time 20 --retry 2 --silent --show-error --output /tmp/lirep-health.json --write-out '%{http_code}' "$BASE$PATH_SUFFIX")"
            echo "$PATH_SUFFIX HTTP $CODE"
            cat /tmp/lirep-health.json
            echo
            test "$CODE" = "200"
          done

  production-smoke:
    name: Verify deployed Worker (read only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check health and public form without creating complaints
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lirep-public-api.vidadecanes-peru.workers.dev"
          curl --fail --silent --show-error --retry 3 "$BASE/health" | grep -Fq '"ok":true'
          curl --fail --silent --show-error --retry 3 "$BASE/health/backend" | grep -Fq '"ok":true'
          curl --fail --silent --show-error --retry 3 "$BASE/libro-de-reclamaciones?public_prefix=VIDACANE" > /tmp/lirep-form.html
          grep -Fq 'Libro de Reclamaciones' /tmp/lirep-form.html
          echo 'PASS - Worker health and public form; no synthetic QA tenant required'
