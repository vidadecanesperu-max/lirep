name: LIREP QA236 - Worker cron and secret names (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa236-worker-runtime-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify real Cloudflare cron and required Worker secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: 6aa99604577aed2046cf3a569db95b3f
          WORKER_NAME: lirep-public-api
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo '::error::Cloudflare credential missing'; exit 1; fi
          BASE="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$BASE/schedules" -o /tmp/lirep-schedules.json
          if jq -e '.success == true and any(.result.schedules[]?; .cron=="*/5 * * * *")' /tmp/lirep-schedules.json >/dev/null; then
            echo 'PASS | Worker cron */5 * * * * configured in Cloudflare'
          else
            echo '::error::Worker cron missing or not configured every five minutes'; exit 1
          fi
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$BASE/secrets" -o /tmp/lirep-secrets.json
          if ! jq -e '.success==true' /tmp/lirep-secrets.json >/dev/null; then echo '::error::Cloudflare secrets API returned failure'; exit 1; fi
          for name in RESEND_API_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if jq -e --arg name "$name" 'any(.result[]?; .name==$name)' /tmp/lirep-secrets.json >/dev/null; then
              echo "PASS | $name secret is configured on Worker"
            else
              echo "::error::Required Worker secret $name missing"; exit 1
            fi
          done
          echo 'Checking stored Cloudflare cron events for the last 40 minutes (sanitized output)'
          START_MS=$(date -u -d '40 minutes ago' +%s%3N)
          END_MS=$(date -u +%s%3N)
          jq -n --argjson from "$START_MS" --argjson to "$END_MS" '{view:"events",limit:200,timeframe:{from:$from,to:$to},filters:[{key:"$metadata.service",operation:"eq",type:"string",value:"lirep-public-api"}]}' > /tmp/lirep-query-request.json
          STATUS=$(curl --silent --show-error -o /tmp/lirep-query-result.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' -X POST --data-binary @/tmp/lirep-query-request.json "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/observability/telemetry/query")
          if [ "$STATUS" = '200' ] && jq -e '.success==true' /tmp/lirep-query-result.json >/dev/null 2>&1; then
            jq -r '"PASS | log query succeeded", "Total log events: " + ((.result.events // [])|length|tostring), "Scheduled call evidence: " + (((.result.events // [])|tostring|test("scheduled|cron|LIREP_RESPONSE";"i"))|tostring), "Response claim error evidence: " + (((.result.events // [])|tostring|contains("LIREP_RESPONSE_CLAIM_FAILED"))|tostring), "Scheduler error evidence: " + (((.result.events // [])|tostring|contains("LIREP_RESPONSE_SCHEDULER_FAILED"))|tostring)' /tmp/lirep-query-result.json
          else
            echo "INFO | log query unavailable (HTTP $STATUS); cron and secret name checks still valid"
            jq -r '.errors[]?.message // empty' /tmp/lirep-query-result.json | cut -c1-180 || true
          fi
          rm -f /tmp/lirep-schedules.json /tmp/lirep-secrets.json /tmp/lirep-query-request.json /tmp/lirep-query-result.json
          echo 'QA237 PASS | read-only; no production update or secret values printed'
